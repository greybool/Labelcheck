# Конфигурация поиска LabelCheck. Поведение меняется здесь, не в коде.

embedding:
  model: text-embedding-3-small
  dimensions: 1536
  batch_size: 64                # чанков в одном API-вызове
  cache: data/embeddings.npz    # кэш векторов с SHA256-пломбой корпуса (не в git)
  # Шапка, добавляемая к тексту чанка перед эмбеддингом (контекст для парафраз).
  # Явный список — какие метаданные попадают в вектор, а какие нет.
  header_fields: [regulation_id, section, subsection, appendix]

bm25:
  stemmer: russian              # Snowball-стеммер; null — отключить (для сравнения)
  # E511 латиницей → е511 кириллицей: в корпусе 2906 Е-кодов кириллицей
  # и 169 латиницей, на упаковках встречаются оба алфавита.
  normalize_latin_e: true

qdrant:
  mode: memory                  # memory — встроенный, векторы из npz-кэша;
  url: http://localhost:6333    # server — по url (docker-compose, День 10)
  collection: labelcheck

search:
  candidates: 20                # выдача каждого метода до слияния
  top_k: 10                     # итоговая выдача после слияния
  rrf_k: 60                     # константа RRF (стандарт из статьи Cormack et al., 2009)

vision:
  # Чтение PDF-макета: два прохода (обзор → чтение регионов кропами).
  # Решения Дня 4 подтверждены замерами, см. docs/PIPELINE.md.
  render_scale: 4               # px = pt × scale; кегль 6 pt → 24 px (замер: читаемо)
  overview_long_side: 2048      # px длинной стороны обзорного изображения
                                #   (= бюджет detail:high; меньше — мелкие блоки
                                #   на широких лентах теряют точность рамок)
  pad_pct: 4.0                  # запас вокруг рамки региона, % стороны макета
                                #   (рамки обзора гуляют на 2–4% — замер Дня 4)
  retry_pad_pct: 10.0           # паддинг повторной попытки, если первое чтение
                                #   пустое/сплошь [неразборчиво] (рамка уехала)
  retry_min_side_pct: 14.0      # при повторе рамка расширяется от центра до
                                #   минимум этой доли стороны (мелкий блок при
                                #   сдвиге рамки иначе не поймать)
  max_crop_px: 2000             # кроп длиннее — режется пополам с перехлёстом,
                                #   НЕ даунскейлится (ужатие = галлюцинации, замер Дня 4)
  crop_overlap_pct: 10          # перехлёст половинок разрезанного кропа, %
  # Категории регионов обзора. technical не читается (обвязка дизайнера).
  kinds: [product_name, composition, nutrition, net_weight, dates_storage,
          manufacturer, marks, usage, other_text, technical]
  # Типы блоков, отсутствие которых попадает в missing[] итогового JSON
  # (предупреждение о возможной неполноте, не вердикт).
  required_kinds: [product_name, composition, nutrition, net_weight,
                   dates_storage, manufacturer]
  # Kind-метки обзора недетерминированы (состав может прийти как other_text) —
  # блок считается найденным и тогда, когда его сигнальные слова есть
  # в прочитанном тексте. Проверка по содержимому надёжнее меток.
  kind_markers:
    composition: ["состав:", "ingredients"]
    nutrition: ["пищевая ценность", "энергетическая ценность", "ккал", "kcal"]
    net_weight: ["масса нетто", "net weight", "вес нетто"]
    dates_storage: ["годен до", "срок годности", "best before", "условия хранения"]
    manufacturer: ["изготовитель", "manufacturer", "импортёр", "импортер"]
  overview_split_aspect: 2.0    # макет вытянут сильнее — обзор по половинам
                                #   (на обзоре целой ленты мелкие блоки
                                #   пропадают: пропуск блока изготовителя на тестовой ленте)
  dedup_iou: 0.5                # перекрытие рамок одного kind выше — дубль
                                #   из зоны перехлёста половинок, снимается
  # Сверка vision-текста с текстовым слоем PDF (если слой есть):
  # доля слов слоя, не найденных в vision-тексте, выше порога →
  # статус региона «требует ручной проверки».
  text_layer_mismatch_threshold: 0.15
  min_word_len: 3               # слова короче не участвуют в сверке (шум)
