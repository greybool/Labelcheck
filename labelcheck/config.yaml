# Конфигурация поиска LabelCheck. Поведение меняется здесь, не в коде.

embedding:
  model: text-embedding-3-small
  dimensions: 1536
  batch_size: 64                # чанков в одном API-вызове
  cache: data/embeddings.npz    # кэш векторов с SHA256-пломбой корпуса (не в git)
  # Шапка, добавляемая к тексту чанка перед эмбеддингом (контекст для парафраз).
  # Явный список — какие метаданные попадают в вектор, а какие нет.
  header_fields: [regulation_id, section, subsection, appendix]

bm25:
  stemmer: russian              # Snowball-стеммер; null — отключить (для сравнения)
  # E511 латиницей → е511 кириллицей: в корпусе 2906 Е-кодов кириллицей
  # и 169 латиницей, на упаковках встречаются оба алфавита.
  normalize_latin_e: true

qdrant:
  mode: memory                  # memory — встроенный, векторы из npz-кэша;
  url: http://localhost:6333    # server — по url (docker-compose, День 10)
  collection: labelcheck

search:
  candidates: 20                # выдача каждого метода до слияния
  top_k: 10                     # итоговая выдача после слияния
  rrf_k: 60                     # константа RRF (стандарт из статьи Cormack et al., 2009)

rewrite:
  # Query rewriting (День 5): CHEAP_MODEL переформулирует запрос «языком
  # регламента» — лечит лексический разрыв упаковка↔норматив (кейс смоука
  # Дня 3: «аллергены» ↔ «компоненты, вызывающие аллергические реакции»).
  # Оригинальный запрос ВСЕГДА участвует в слиянии; переформулировки только
  # добавляют выдачи в RRF. enabled: false — сравнение метрик без rewriting
  # (День 7 меряет оба режима).
  enabled: true
  n: 2                          # переформулировок на запрос
  model_env: CHEAP_MODEL        # имя переменной .env с моделью
  cache: data/query_rewrites.json  # кэш: аспектные запросы статичны, платим
                                #   один раз; файл идёт в git — у ревьюера
                                #   те же переформулировки, что в метриках
  prompt: |
    Ты помогаешь поиску по техническим регламентам ЕАЭС о пищевой продукции
    (ТР ТС 005/2011, 021/2011, 022/2011, 029/2012, 034/2013, ТР ЕАЭС 040/2016).
    Переформулируй запрос пользователя {n} разными способами так, как та же
    норма сформулирована в тексте регламента: канцелярская лексика,
    официальные термины («компоненты», «пищевая продукция», «маркировка»,
    «потребительская упаковка»). Сохраняй смысл запроса, не расширяй и не
    сужай его. Верни JSON: {{"rewrites": ["...", "..."]}}

eval:
  # Retrieval evaluation (День 7): эталон вопросов + прогоны метрик.
  # Все решения — docs/TZ-LABELCHECK.md §5.1/§5.4 и evaluation/EVALUATION.md.
  gt_model_env: CHEAP_MODEL       # генератор вопросов — дешёвой моделью
  seed: 20260830                  # детерминизм выборки чанков
  min_chunk_chars: 200            # короче — чанк в выборку не берётся (обрывки)
  # Чанков в выборке по категориям. Стратификация обязательна: корпус на
  # ~47% — окна таблиц 029, равномерная выборка выродится в экзамен про Е-коды.
  quotas:
    body_clause: 100
    appendix_clause: 60
    table_window: 60
    no_clause: 20
  # Пол: минимум чанков на регламент внутри категории (если у регламента
  # чанков этой категории меньше — берутся все). Без пола разбивка метрик
  # по регламентам оставит 005/021/040 без строк.
  min_per_regulation: 8
  # На чанк: 2 вопроса терминологией фрагмента + 1 бытовым языком закупщика.
  # Поле style в эталоне: rewriting почти не влияет на verbatim-вопросы
  # (они уже «языком регламента») — эффект виден на paraphrase-разбивке.
  questions_verbatim: 2
  questions_paraphrase: 1
  concurrency: 8                  # параллельных CHEAP-вызовов при генерации
  gt_path: evaluation/ground_truth.jsonl
  gt_meta_path: evaluation/ground_truth.meta.json
  gt_partial_path: evaluation/ground_truth.partial.jsonl  # resume-журнал (не в git)
  rewrites_cache: evaluation/gt_rewrites.json  # кэш переформулировок GT-вопросов (в git)
  question_embeddings_cache: data/gt_embeddings.npz  # кэш векторов вопросов (не в git)
  runs_dir: evaluation/runs       # immutable снапшоты прогонов (в git)
  metrics_dir: evaluation/metrics # пересчитываемые метрики (в git)
  gt_prompt: |
    Ты готовишь экзамен для поисковой системы по техническим регламентам ЕАЭС
    о пищевой продукции. Тебе дают фрагмент текста регламента (пункт, строки
    таблицы приложения или текст без номера). Составь {n_verbatim} вопроса,
    на которые фрагмент прямо отвечает, терминологией самого фрагмента, и
    {n_paraphrase} вопрос о том же — бытовым языком специалиста по закупкам,
    который регламент не читал (без канцелярских терминов фрагмента).
    Правила:
    - Вопрос понятен сам по себе, без фрагмента перед глазами: называй продукт
      или объект своими словами («мороженая рыба», «добавка Е451»); никаких
      «в этом пункте», «согласно данному документу».
    - ЗАПРЕЩЕНО упоминать номера пунктов, статей, разделов, приложений и
      названия или номера регламентов.
    - Вопрос опирается на конкретное содержание фрагмента, а не на общие
      слова его темы; на вопрос нельзя ответить без этого фрагмента.
    - Если фрагмент непригоден для осмысленных вопросов (шапка, оглавление,
      обрывок) — верни пустые списки.
    Верни JSON: {{"verbatim": ["...", "..."], "paraphrase": ["..."]}}

verdict:
  # Вердикты по аспектам (День 6). Контекст строится по принципу basis-first:
  # ВСЕ тело-пункты оснований аспекта идут в промпт детерминированно (решение
  # Сергея: известные нормы не соревнуются за место в топ-К ретрива), ретрив
  # добавляет сверху строки табличных приложений и нормы вне basis.
  model_env: MAIN_MODEL         # вердикты — полной моделью (ТЗ §4.1)
  cheap_env: CHEAP_MODEL        # орфография (аспект 19) — дешёвой
  retrieval_extra: 4            # чанков ретрива СВЕРХ basis (после дедупа)
  max_context_chars: 60000      # предохранитель на аспект: basis не режется
                                #   никогда (перебор basis = ошибка конфига,
                                #   громкое исключение); режется ретрив-хвост
  reports_dir: data/reports     # отчёты (в .gitignore — тексты реальных макетов)

vision:
  # Чтение PDF-макета: два прохода (обзор → чтение регионов кропами).
  # Решения Дня 4 подтверждены замерами, см. docs/PIPELINE.md.
  render_scale: 4               # px = pt × scale; кегль 6 pt → 24 px (замер: читаемо)
  overview_long_side: 2048      # px длинной стороны обзорного изображения
                                #   (= бюджет detail:high; меньше — мелкие блоки
                                #   на широких лентах теряют точность рамок)
  pad_pct: 4.0                  # запас вокруг рамки региона, % стороны макета
                                #   (рамки обзора гуляют на 2–4% — замер Дня 4)
  retry_pad_pct: 10.0           # паддинг повторной попытки, если первое чтение
                                #   пустое/сплошь [неразборчиво] (рамка уехала)
  retry_min_side_pct: 14.0      # при повторе рамка расширяется от центра до
                                #   минимум этой доли стороны (мелкий блок при
                                #   сдвиге рамки иначе не поймать)
  max_crop_px: 2000             # кроп длиннее — режется пополам с перехлёстом,
                                #   НЕ даунскейлится (ужатие = галлюцинации, замер Дня 4)
  crop_overlap_pct: 10          # перехлёст половинок разрезанного кропа, %
  # Категории регионов обзора. technical не читается (обвязка дизайнера).
  kinds: [product_name, composition, nutrition, net_weight, dates_storage,
          manufacturer, marks, usage, other_text, technical]
  # Типы блоков, отсутствие которых попадает в missing[] итогового JSON
  # (предупреждение о возможной неполноте, не вердикт).
  required_kinds: [product_name, composition, nutrition, net_weight,
                   dates_storage, manufacturer]
  # Kind-метки обзора недетерминированы (состав может прийти как other_text) —
  # блок считается найденным и тогда, когда его сигнальные слова есть
  # в прочитанном тексте. Проверка по содержимому надёжнее меток.
  kind_markers:
    composition: ["состав:", "ingredients"]
    nutrition: ["пищевая ценность", "энергетическая ценность", "ккал", "kcal"]
    net_weight: ["масса нетто", "net weight", "вес нетто"]
    dates_storage: ["годен до", "срок годности", "best before", "условия хранения"]
    manufacturer: ["изготовитель", "manufacturer", "импортёр", "импортер"]
  overview_split_aspect: 2.0    # макет вытянут сильнее — обзор по половинам
                                #   (на обзоре целой ленты мелкие блоки
                                #   пропадают: пропуск блока изготовителя на тестовой ленте)
  dedup_iou: 0.5                # перекрытие рамок одного kind выше — дубль
                                #   из зоны перехлёста половинок, снимается
  # Сверка vision-текста с текстовым слоем PDF (если слой есть):
  # доля слов слоя, не найденных в vision-тексте, выше порога →
  # статус региона «требует ручной проверки».
  text_layer_mismatch_threshold: 0.15
  min_word_len: 3               # слова короче не участвуют в сверке (шум)
