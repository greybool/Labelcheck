# Доменные вопросы для смоук-теста ретрива (evaluation/smoke_retrieval.py).
# Это проверка «глазами» до формальных метрик Дня 7: по каждому вопросу
# видно топ выдачи всех трёх методов. expect — где, по мнению домена,
# лежит ответ (подсказка для глаз, в зачёте не участвует).

questions:
  - q: "Какая допускается масса глазури для мороженой рыбной продукции?"
    expect: "040 п.33"
  - q: "Как указывается масса нетто продукта в глазури?"
    expect: "022 ч.4.5"
  - q: "Какие аллергены нужно указывать в маркировке?"
    expect: "022 ч.4.4 п.14"
  - q: "Как указывать пищевую добавку консервант E243 в составе?"
    expect: "029 ст.9-10, прил.2"
  - q: "В каких единицах указывается энергетическая ценность продукта?"
    expect: "022 ч.4.9"
  - q: "Какой формат у срока годности «годен до»?"
    expect: "022 ч.4.7"
  - q: "Что указывать про изготовителя импортной продукции?"
    expect: "022 ч.4.8"
  - q: "Когда в маркировке пишут сведения о ГМО?"
    expect: "022 ч.4.11"
  - q: "Какое мясное сырьё запрещено для детского питания?"
    expect: "021 ст.8 п.8-9"
  - q: "Требования к температуре хранения замороженных полуфабрикатов"
    expect: "021/034"
