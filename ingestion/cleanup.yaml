# Правила очистки и разбора PDF по типу источника (см. text_source в data/sources.yaml).
# Используется ingestion/parse.py.

cleanup:
  # Источник cntd: распечатки страниц docs.cntd.ru — колонтитул на каждой странице.
  cntd:
    # Строка удаляется, если СОДЕРЖИТ любую из подстрок:
    drop_contains:
      - "Документ сохранен с портала docs.cntd.ru"
      - "Редакция документа с учетом"
      - "изменений и дополнений подготовлена"
      - 'АО "Кодекс"'
    # Строка удаляется, если ЦЕЛИКОМ подходит под регулярное выражение:
    drop_regex:
      - '^ТР (ТС|ЕАЭС) \d+/\d+ Технический регламент.*Страница \d+$'
      - '^Технический регламент (Таможенного союза|Евразийского экономического союза) от \d{2}.*$'
      - '^Технический регламент$'
      - '^действующая с .{0,40}\)$'        # перенос колонтитула 034 на вторую строку
      - '^\d{1,3}$'                        # строка-номер страницы

  # Источник garant: экспорт из системы ГАРАНТ (файл 029/2012).
  garant:
    drop_contains:
      - "novotest.ru"
      - "Тел./факс"
      - 'от 20 июля 2012 г. N 58 "О принятии'   # сквозной колонтитул
    drop_regex:
      - '^С изменениями и дополнениями от:$'
      - '^\d{1,2} [а-яё]+ \d{4} г\.[,;]?$'      # одинокая строка-дата после предыдущей
      - '^См\. предыдущую редакцию$'
      - '^\d{1,3}$'
    # Блок из нескольких строк: от строки start до строки end включительно (максимум max_span строк).
    drop_blocks:
      - start: '^Информация об изменениях:'
        end: 'См\. предыдущую редакцию$'
        max_span: 4

# Разбор структуры: тип нумерации каждого документа.
structures:
  tr_ts_005_2011: articles_upper    # СТАТЬЯ 1. ЗАГОЛОВОК
  tr_ts_021_2011: articles_upper
  tr_ts_022_2011: articles_upper
  tr_ts_029_2012: articles_mixed    # Статья 1. Заголовок
  tr_ts_034_2013: roman_sections    # I. ЗАГОЛОВОК, сквозные пункты
  tr_eaeu_040_2016: roman_sections

# Параметры нарезки.
chunking:
  max_chars: 3500       # длиннее — режем на части с теми же метаданными
  min_chars: 120        # короче — считаем заголовком подраздела, не отдельным чанком
  window_lines: 30      # окно для приложений без нумерации пунктов (таблицы-перечни)
  window_overlap: 3     # перехлёст окон: строка таблицы, порванная границей окна,
                        # целиком попадает хотя бы в одно из соседних окон
  header_lines: 6       # сколько строк шапки приложения повторять в каждом оконном чанке
  table_scrap_share: 0.5  # если больше этой доли «пунктов» приложения — обрывки
                          # короче min_chars, приложение считается таблицей и режется окнами
